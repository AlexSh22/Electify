<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Election Match 2026 · התאמה בבחירות</title>
  <meta name="description" content="Answer 10 questions and see which Israeli party is closest to you. Unofficial, neutral, open source.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://alexsh22.github.io/Electify/">
  <meta property="og:title" content="Electify · איזו מפלגה הכי קרובה אליך?">
  <meta property="og:description" content="10 שאלות, 13 מפלגות, בחירות 2026. Which Israeli party is closest to you?">
  <meta property="og:image" content="https://alexsh22.github.io/Electify/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">✓</span><span data-i18n="brand"></span></div>
    <button id="lang" class="lang" type="button" aria-label="Switch language">English</button>
  </header>

  <main id="app">
    <!-- Intro -->
    <section id="intro" class="screen active">
      <div class="hero">
        <p class="eyebrow" id="electionLabel"></p>
        <h1 data-i18n="title"></h1>
        <p class="lead" data-i18n="lead"></p>
        <button id="start" class="btn primary big" type="button" data-i18n="start"></button>
        <p class="fine" data-i18n="disclaimer"></p>
      </div>
      <div class="orbit" aria-hidden="true"><div></div><div></div><div></div></div>
    </section>

    <!-- Quiz -->
    <section id="quiz" class="screen">
      <div class="progress"><div id="progressBar"></div></div>
      <div class="qmeta"><span id="qnum"></span><span id="qtopic" class="chip"></span></div>
      <h2 id="qtext" class="qtext"></h2>
      <div id="scale" class="scale" role="radiogroup"></div>
      <div class="qactions">
        <button id="back" class="btn ghost" type="button" data-i18n="back"></button>
        <label class="important"><input type="checkbox" id="important"><span data-i18n="important"></span></label>
        <button id="skip" class="btn ghost" type="button" data-i18n="skip"></button>
      </div>
    </section>

    <!-- Results -->
    <section id="results" class="screen">
      <div class="winner card">
        <div class="ring"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle id="ringFg" cx="60" cy="60" r="52" class="ring-fg"/></svg><span id="ringPct"></span></div>
        <div>
          <p class="eyebrow" data-i18n="closest"></p>
          <h2 id="winnerName"></h2>
          <p id="winnerLeader" class="muted"></p>
        </div>
      </div>

      <div class="grid">
        <div class="card">
          <h3 data-i18n="ranking"></h3>
          <p class="muted small" data-i18n="rankingHint"></p>
          <ol id="bars" class="bars"></ol>
        </div>
        <div class="card">
          <h3 data-i18n="map"></h3>
          <p class="muted small" data-i18n="mapHint"></p>
          <svg id="map" class="map" viewBox="0 0 400 400" role="img"></svg>
        </div>
      </div>

      <div class="card">
        <h3><span data-i18n="compare"></span> <span id="compareName" class="accent"></span></h3>
        <div class="compare">
          <svg id="radar" class="radar" viewBox="-60 0 560 440" role="img"></svg>
          <ul id="breakdown" class="breakdown"></ul>
        </div>
      </div>

      <div class="actions">
        <button id="shareImg" class="btn ig" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.64.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92C2.17 15.58 2.16 15.2 2.16 12s.01-3.58.07-4.85C2.38 3.92 3.9 2.38 7.15 2.23 8.42 2.17 8.8 2.16 12 2.16M12 0C8.74 0 8.33.01 7.05.07 2.7.27.27 2.69.07 7.05.01 8.33 0 8.74 0 12s.01 3.67.07 4.95c.2 4.36 2.62 6.78 6.98 6.98C8.33 23.99 8.74 24 12 24s3.67-.01 4.95-.07c4.35-.2 6.78-2.62 6.98-6.98.06-1.28.07-1.69.07-4.95s-.01-3.67-.07-4.95c-.2-4.35-2.62-6.78-6.98-6.98C15.67.01 15.26 0 12 0m0 5.84a6.16 6.16 0 1 0 0 12.32 6.16 6.16 0 0 0 0-12.32M12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8m6.4-11.85a1.44 1.44 0 1 0 0 2.88 1.44 1.44 0 0 0 0-2.88"/></svg><span data-i18n="shareImg"></span></button>
        <button id="shareFb" class="btn fb" type="button"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M24 12.07C24 5.41 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.1 10.13 24v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.8-4.7 4.54-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.5c-1.5 0-1.96.93-1.96 1.89v2.26h3.32l-.53 3.5h-2.8V24C19.62 23.1 24 18.1 24 12.07"/></svg><span data-i18n="shareFb"></span></button>
        <button id="share" class="btn ghost" type="button" data-i18n="share"></button>
        <button id="restart" class="btn ghost" type="button" data-i18n="restart"></button>
      </div>
      <p class="fine" data-i18n="disclaimer"></p>
      <p class="fine"><a href="https://github.com/AlexSh22/Electify/blob/main/SOURCES.md" data-i18n="sources"></a></p>
    </section>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="data.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
